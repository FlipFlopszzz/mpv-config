# 使用 Windows Fluent 风格图标
icon_style=fluent

# 控制栏尺寸
scalewindowed=1.1
scalefullscreen=1.0

# 停止移动鼠标 1 秒后隐藏；淡入淡出为 150ms
hidetimeout=1500
fadeduration=150
fadein=yes
visibility=auto

# 右侧时间显示总时长，而不是剩余时长
timetotal=yes

# 深色半透明背景（0 为不透明，255 为完全透明）
boxalpha=105
background_color=#101114

# 文字与按钮颜色
buttons_color=#F2F2F2
timecode_color=#F2F2F2
title_color=#F2F2F2

# 悬浮控制条：宽度 760，位置靠近底部
layout=floating
floatingwidth=760
floatingalpha=115
floatingtitle=no
valign=0.9
