# Windows 11 Fluent 风格：仅定义 ModernZ 的外观与控制栏行为。
layout=default
icon_theme=fluent
icon_style=outline
font=Segoe UI

# 控制栏显示与过渡。
showwindowed=yes
showfullscreen=yes
hidetimeout=1500
keep_with_cursor=yes
fadeduration=150
fadein=yes
osc_on_seek=yes

# 尺寸与文本。
vidscale=auto
scalewindowed=1.1
scalefullscreen=1.0
show_title=yes
title=${media-title}
title_font_size=22
truncate_title=yes
timecurrent=yes
time_format=dynamic
time_font_size=16

# 保留原配置已有的核心播放控件。
subtitles_button=no
audio_tracks_button=no
jump_buttons=yes
jump_amount=5
chapter_skip_buttons=no
track_nextprev_buttons=no
volume_control=yes
playlist_button=no
fullscreen_button=yes
info_button=no
ontop_button=no
screenshot_button=no
download_button=no
loop_button=no
shuffle_button=no
speed_button=no

# Fluent 深色半透明外观，采用 Windows 11 系统蓝作为强调色。
osc_color=#101114
title_color=#F2F2F2
time_color=#F2F2F2
side_buttons_color=#F2F2F2
middle_buttons_color=#F2F2F2
playpause_color=#F2F2F2
seekbar_cache_color=#6B6B6B
seekbarfg_color=#0078D4
seekbarbg_color=#4A4A4A
seek_handle_color=#0078D4
seek_handle_border_color=#0078D4
volumebar_match_seek_color=yes
hover_effect_color=#60CDFF
thumbnail_box_color=#171717
thumbnail_box_outline=#404040
osc_fade_strength=100
fade_blur_strength=30
fade_transparency_strength=12
thumbnail_box_radius=8

# 轻量的悬浮反馈与圆角进度条。
hover_effect=size,color,box
button_hover_size=108
button_held_size=96
button_held_box_alpha=20
button_glow_amount=0
tooltip_hints=yes
seek_handle_size=0.8
seek_handle_border_size=0.3
seek_handle_border_hover_size=0.3
seekbar_height=medium
seekrange=yes
seekrangealpha=150
slider_rounded_corners=yes
nibbles_style=gap
nibbles_top=no
nibbles_bottom=no

# 保持底栏紧凑，避免窗口较窄时挤压。
portrait_window_trigger=950
hide_volume_bar_trigger=900
osc_height=60
