# 保留 ModernZ 官方 default 布局，使用此前的精简控件组合与 Win11 Fluent 外观。
layout=default
icon_theme=fluent
icon_style=outline

# 与此前一致的控制栏显示节奏。
hidetimeout=1500
keep_with_cursor=yes
fadeduration=150
fadein=yes
osc_on_seek=yes
scalewindowed=1.1
scalefullscreen=1.0

# 保留此前的核心控制按钮；隐藏额外功能按钮。
subtitles_button=no
audio_tracks_button=no
jump_buttons=yes
jump_amount=5
chapter_skip_buttons=no
track_nextprev_buttons=no
volume_control=yes
playlist_button=no
fullscreen_button=yes
info_button=no
ontop_button=no
screenshot_button=no
download_button=no
loop_button=no
shuffle_button=no
speed_button=no

# Windows 11 系统蓝与深色半透明的 Fluent 外观。
osc_color=#101114
seekbarfg_color=#0078D4
seek_handle_color=#0078D4
seek_handle_border_color=#0078D4
volumebar_match_seek_color=yes
hover_effect_color=#60CDFF
seekbarbg_color=#4A4A4A
seekbar_cache_color=#6B6B6B

# 保持此前较轻的按钮悬浮反馈与圆角时间轴。
hover_effect=size,color,box
button_hover_size=108
button_held_size=96
button_held_box_alpha=20
button_glow_amount=0
slider_rounded_corners=yes
