# 播放 / 暂停
SPACE cycle pause
MBTN_LEFT cycle pause

# 左键双击：全屏 / 退出全屏
MBTN_LEFT_DBL cycle fullscreen

# 进度：每次精确前进或后退 5 秒，仅显示底部控制栏
LEFT no-osd seek -5 relative+exact; script-message osc-show
RIGHT no-osd seek 5 relative+exact; script-message osc-show

# 音量：每次增减 5%，并唤出浮动控制条
UP no-osd add volume 5; script-message osc-show
DOWN no-osd add volume -5; script-message osc-show

# WASD：与方向键一致
a no-osd seek -5 relative+exact; script-message osc-show
d no-osd seek 5 relative+exact; script-message osc-show
w no-osd add volume 5; script-message osc-show
s no-osd add volume -5; script-message osc-show

# 倍速：- / = 每次减慢或加快 0.1×；退格恢复为 1.0×
- add speed -0.1
= add speed 0.1
BS set speed 1.0
